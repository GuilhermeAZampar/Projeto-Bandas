{% extends 'Projeto_Bandas/base.html' %}
{% block title %}
Editar {{banda.nome}}
{% endblock %}
{% block content %}

<section class="formulario-pagina">
<h1>Editar {{banda.nome}}</h1>
<form method="post" enctype="multipart/form-data" class="formulario">
  {% csrf_token %}
  {{form.as_p}}


  <button type="submit" class="botao-principal">Salvar Alterações</button>

</form>

<a href="{%url 'detalhes' banda.id %}" class="botao-voltar">Voltar</a>
</section>
{% endblock %}
